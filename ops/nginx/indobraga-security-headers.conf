# Indobraga - HTTP security headers (QA IB-07).
#
# Include inside the HTTPS `server { ... }` block AND inside every `location` that
# defines its own add_header (nginx does not inherit add_header into such locations),
# e.g. the long-cache static assets location:
#
#   location /assets/ {
#       alias /var/www/indobraga/current/apps/web/.output/public/assets/;
#       add_header Cache-Control "public, max-age=31536000, immutable";
#       include snippets/indobraga-security-headers.conf;
#   }
#
# The Node apps also send these (web via Nitro routeRules incl. a CSP, API via helmet);
# repeating them here protects responses nginx serves itself (static files, error pages).

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
