name: Quality

# Lint, typecheck, tests, build and audit only. Production runs on the Elcodelabs VPS: the
# `Image` workflow publishes the container image and the server deploys it with
# `~/indobraga/deploy.sh <git-sha>` (docs/ELCODELABS_DEPLOYMENT.md). This workflow never deploys.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
          SHADOW_DATABASE_URL: mysql://ci:ci@localhost:3306/ci_shadow

      - name: Validate Prisma schema
        run: npm run db:validate
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
          SHADOW_DATABASE_URL: mysql://ci:ci@localhost:3306/ci_shadow

      - name: Lint
        run: npm run lint

      - name: Test API (with coverage)
        run: |
          set -o pipefail
          npm run test:coverage:api 2>&1 | tee /tmp/test-api.log
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
          SHADOW_DATABASE_URL: mysql://ci:ci@localhost:3306/ci_shadow
          SESSION_SECRET: ci-session-secret-minimum-32-characters-long
          INTERNAL_WORKER_SECRET: ci-internal-worker-secret-minimum-32-chars
          CREDENTIAL_ENCRYPTION_KEY: ci-credential-encryption-key-for-test-only
          NODE_ENV: test

      - name: Show API test output on failure
        if: failure()
        run: |
          echo "## API Test Output (last 100 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 /tmp/test-api.log >> $GITHUB_STEP_SUMMARY || echo "no log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Test Web (with coverage)
        run: npm run test:coverage:web
        env:
          NODE_ENV: test

      - name: Build
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
          SHADOW_DATABASE_URL: mysql://ci:ci@localhost:3306/ci_shadow
          SESSION_SECRET: ci-session-secret-minimum-32-characters-long
          INTERNAL_WORKER_SECRET: ci-internal-worker-secret-minimum-32-chars
          CREDENTIAL_ENCRYPTION_KEY: ci-credential-encryption-key-for-test-only

      - name: Show build output on failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "## Build Output (last 120 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -120 /tmp/build.log >> $GITHUB_STEP_SUMMARY || echo "no log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          message="$(tail -40 /tmp/build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          echo "::error title=Build failed::$message"

      - name: Security audit
        run: npm run security:audit
