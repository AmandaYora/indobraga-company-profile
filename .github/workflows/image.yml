name: Image

# Builds the single-container image and pushes it to GHCR (Elcodelabs VPS convention:
# build in CI, the VPS only pulls and runs - it never compiles).
#
# This workflow only BUILDS AND PUBLISHES the image. It never deploys anything and never
# touches a server: deploying is `~/indobraga/deploy.sh <git-sha>` on the Elcodelabs VPS.
# (The `Quality` workflow still owns the existing production deploy; they are independent.)
#
# Triggers: manual run (any ref) and pushes to the container branch while it is being
# prepared. Wire it to `main` only when the cutover is decided.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/elcodelabs-container

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/amandayora/indobraga-company-profile

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once into the local daemon and smoke-test the real image (migrate + seed + serve
      # against a throw-away MySQL) BEFORE anything is pushed to GHCR.
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: indobraga-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (migrate, seed, serve)
        run: bash ops/docker/smoke-test.sh indobraga-smoke:ci

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # The VPS pins the exact commit (`<git-sha>`); `latest` is only a convenience pointer.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo "\`${IMAGE}:${GITHUB_SHA}\`"
            echo ""
            echo "Deploy on the Elcodelabs VPS: \`cd ~/indobraga && ./deploy.sh ${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
